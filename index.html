  <script id="boot-theme">
    /* React 挂载前先定主题，避免闪烁与老数据不生效 */
    (function(){
      var t='ember';
      try{
        var raw=localStorage.getItem('lifetree.project.v1');
        if(raw){
          var d=JSON.parse(raw);
          if(d&&d.theme){
            t = d.theme==='light' ? 'day' : d.theme==='dark' ? 'ember' : d.theme;
          }
        }
      }catch(e){}
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <div id="root"></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(r){ r.update(); }).catch(function(){});
  });
}
</script>
